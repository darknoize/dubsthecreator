<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1365" height="2048" viewBox="0 0 1365 2048">

  <title>Dark Gradient Background + Glow Wave</title>
  <desc>Vector background with dark gradient and soft glowing wave. No dots.</desc>

  <defs>
    <!-- Base dark gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070C14"/>
      <stop offset="60%" stop-color="#05080F"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>

    <!-- Subtle blue radial glow -->
    <radialGradient id="blueGlow" cx="20%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#7AA6FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7AA6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle teal radial glow -->
    <radialGradient id="tealGlow" cx="85%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#3EF2D2" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3EF2D2" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow blur filter -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Base gradient -->
  <rect x="0" y="0" width="1365" height="2048" fill="url(#bgGrad)"/>

  <!-- Radial glows -->
  <rect x="0" y="0" width="1365" height="2048" fill="url(#blueGlow)"/>
  <rect x="0" y="0" width="1365" height="2048" fill="url(#tealGlow)"/>

  <!-- Glowing wave line -->
  <path d="M0 573
           C 477 450,
             887 655,
             1365 512"
        stroke="#3EF2D2"
        stroke-opacity="0.35"
        stroke-width="4"
        fill="none"
        filter="url(#softGlow)"/>

</svg>
